<!-- ReqH1 -->
<!DOCTYPE html>
<html lang="es-ES">
    <!-- ReqH2 -->
    <head>
        <meta charset = "utf-8">
            <meta name= "viewport" content = "width=device-width, initial-scale=1.0">
            <meta name="author" content = "Mónica Perdiguer Caso">
            <meta name="description" content= "Formulario de unirse de la página">
            <meta name="keywords" content= "Stardew Valley, Unirse, información">
        <title>Unirse</title>
        <link rel="stylesheet" href="../css/styles.css">
        <!-- con defer le decimos al navegador que primero construya el arbol
        del DOM y luego ya puede ejecutar las funciones -->
        <script src="../js/myJS.js" defer></script>
    
        <script defer src="../js/i18n/translations.js"></script>
        <script defer src="../js/i18n/i18n.js"></script>
    </head>

    <body>
        <!-- ReqH3 -->
        <header>
            <!-- ReqI18N6 -->
            <div class="language-box"> 
                <label for="language-switcher" data-i18n="common.language.label">Idioma</label> 
                <select id="language-switcher" onchange="setLocale(this.value)"> 
                    <option value="es" data-i18n="common.language.spanish">Español</option> 
                    <option value="en" data-i18n="common.language.english">English</option> 
                </select> 
            </div>
            <!-- ReqH5 -->
            <h1 data-i18n="unirse.titulo">Unirse</h1>
        </header>

        <!-- RequH8 -->
        <nav>
            <ul>
                <!-- ReqH11 -->
                <li><a href="../index.html" data-i18n="nav.index"> Inicio</a></li>
                <li><a href="personajes.html" data-i18n="nav.personajes"> Personajes</a></li>
            </ul>
        </nav>

        <main>
            <section>
                <h2 data-i18n="unirse.form">Formulario</h2>
                <p>Únete a nuestra comunidad para enterarte cuanto antes de las nuevas actualizaciones.</p>
                <!-- ReqH16 y ReqJ4-->
            <form name="formularioUsuario" action="mailto:info@stardew.com?subject=Unirse%20Form"
                onsubmit="return validateForm()"
                onkeydown="handleKeyDown(event)"
                method="post">
                <fieldset class="cuadrado">
                    <legend class="cuadrado">Tus datos personales</legend>
                    
                    <label for="nombre" data-i18n="form.nombre">Nombre:</label>
                    <!-- ReqJ3 -->
                    <input type="text" id="nombre" name="nombre" pattern="[A-Z][a-z]+" required 
                        oninput="updatePreview(); checkValidityState(this)" 
                        onmouseover="handleMouseOver(this)" onmouseout="handleMouseOut(this)"
                        data-i18n-placeholder="form.nombrePlaceholder"><br><br>

                    <label for="correo" data-i18n="form.email">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" required 
                        oninput="updatePreview(); checkValidityState(this)"
                        onmouseover="handleMouseOver(this)" onmouseout="handleMouseOut(this)"><br><br>

                    <label for="contraseña" data-i18n="form.contraseña">Contraseña:</label>
                    <input type="password" id="contraseña" name="contraseña" required
                        oninput="updatePreview(); checkValidityState(this)"
                        onmouseover="handleMouseOver(this)" onmouseout="handleMouseOut(this)"><br><br>

                    <label for="telefono" data-i18n="form.telefono">Teléfono (Español solo):</label>
                    <input type="tel" id="telefono" name="telefono" pattern="^(\+34|0034|34)?[6-7][0-9]{8}$" required
                        oninput="updatePreview(); checkValidityState(this)"
                        onmouseover="handleMouseOver(this)" onmouseout="handleMouseOut(this)"><br><br>

                    <label>¿Deseas que te mandemos correos con las nuevas novedades?</label><br>
                    <input type="radio" id="si" name="grupo" value="si">
                    <label for="si"> Sí </label>
                    <input type="radio" id="no" name="grupo" value="no">
                    <label for="no"> No </label><br><br>

                    <label for="mensaje">Observaciones:</label><br>
                    <textarea id="mensaje" name="mensaje" onmouseover="handleMouseOver(this)" onmouseout="handleMouseOut(this)"></textarea><br><br>

                    <div id="error-box" class="error-box" style="display: none; color: white; background-color: #d32f2f; padding: 10px; margin-bottom: 10px; border-radius: 5px;"></div>

                    <button type="submit" class="btn" data-i18n="form.enviar">Enviar</button>
                    <button type="reset" id="reset-btn" class="btn" data-i18n="form.limpiar">Limpiar formulario</button>
                </fieldset>
            </form>

                <section id="preview" class="cuadrado">
                    <h2 data-i18n="form.vistaTitulo">Vista previa</h2>
                    <div id="preview-content">
                        <p data-i18n="form.vista">La previsualización se mostrará aquí.</p>
                    </div>
                </section>
            </section>
        </main>
        
        <footer>
            <p data-i18n="footer.copy">&copy; 2026 Página de información sobre Stardew Valley</p>
        </footer>
    </body>
</html>
